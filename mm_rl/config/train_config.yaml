# Complete training configuration that includes robot and simulation configs

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_rl"
    path: "config/rl_config.yaml"

# Override simulation settings for RL training
simulation:
  max_episode_steps: 1000
  gui: false  # Set to true for visualization during training
