# Scene wiring for cluttered obstacles (sim + controller).

simulation:
  static_obstacles:
    enabled: True

    urdf:
      package: "mm_assets"
      path: "scenes/urdf/static_obstacles.urdf"
      includes:
        - "$(find mm_assets)/scenes/xacro/static_obstacles.urdf.xacro"
      args:
        obstacle_params_file: "$(find mm_run)/config/mpsf_experiments/scenes/cluttered.yaml"

controller:
  scene:
    enabled: True
    collision_link_names:
      static_obstacles:
        - "ground"
        - "obstacle_cylinder_1_link"
        - "obstacle_cylinder_2_1_link"
        - "obstacle_cylinder_2_2_link"
        - "obstacle_cylinder_3_1_link"
        - "obstacle_cylinder_3_2_link"
        - "obstacle_cylinder_4_link"
    urdf:
      package: "mm_assets"
      path: "scenes/urdf/static_obstacles.urdf"
      includes:
        - "$(find mm_assets)/scenes/xacro/static_obstacles.urdf.xacro"
      args:
        obstacle_params_file: "$(find mm_run)/config/mpsf_experiments/scenes/cluttered.yaml"
