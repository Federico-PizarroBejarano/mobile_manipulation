# Cluttered scene for base-teleop + tray balancing.
# Lab workspace: x in (-4, 0), y in (-4, 1).
#
# Intended corridor: drive roughly along +x near y ≈ -1.5 (from ~-3 toward ~-0.2).
# Short cylinders force lateral base weaving. The tall cylinder sits near the
# corridor so a low tray (~0.7 m) clips it unless the arm lifts.

cylinder:
  # Short, south of corridor — push the base north
  - name: "cylinder_1"
    radius: 0.22
    length: 0.40
    xyz: [-2.5, -2.45, 0.20]
    rpy: [0, 0, 0]

  # Short, north of corridor — push the base south
  - name: "cylinder_2"
    radius: 0.24
    length: 0.45
    xyz: [-1.7, -0.55, 0.225]
    rpy: [0, 0, 0]

  # Tall gate near the corridor — tray height collision unless EE rises
  # Cylinder along z: center 0.75, length 1.50 → occupies z in [0, 1.5]
  - name: "cylinder_3"
    radius: 0.18
    length: 1.50
    xyz: [-0.95, -1.35, 0.75]
    rpy: [0, 0, 0]

  # Short, south again — second weave after the tall gate
  - name: "cylinder_4"
    radius: 0.22
    length: 0.40
    xyz: [-0.25, -2.40, 0.20]
    rpy: [0, 0, 0]
