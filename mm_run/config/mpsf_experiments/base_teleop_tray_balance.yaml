# Base teleop + tray balancing (empty vs cluttered).
#
# Human drives the base; MPC/MPSF completes the arm and keeps the tray upright
# under acceleration (AlignedToolConstraint). In the cluttered scene the arm
# must also lift / weave around obstacles.
#
# SCENE SWITCH — comment one pair below (acados name + scene include + static flag).
# Regenerating Acados is required when the solver name changes.
#
# Empty:
#   acados.name: "MPSF_BaseTeleop_Tray_Empty"
#   static_obstacles_collision_avoidance_enabled: False
#   include scene: config/scene/empty.yaml
#
# Cluttered (default below):
#   acados.name: "MPSF_BaseTeleop_Tray_Clutter"
#   static_obstacles_collision_avoidance_enabled: True
#   include scene: config/mpsf_experiments/scenes/tray_teleop_clutter_scene.yaml
#
# Hardware:
#   roslaunch mobile_manipulation_central thing.launch
#   roslaunch mm_run hardware_teleop.launch \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/base_teleop_tray_balance.yaml
# Hold d-pad up, Square or Enter to start. Stay in base teleop mode (Cross toggles base/EE).
# Triangle toggles gripper. Square again to stop.
#
# Sim:
#   roslaunch mm_run run_pybullet_sim.launch teleop:=mpsf gui:=True \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/base_teleop_tray_balance.yaml

controller:
  base_mask: [false, false, false]
  ee_mask: [false, false, false, false, false, false]

  base_velocity_guard:
    enabled: true

  # Slightly less filtering than joystick_teleop_with_obstacles so base accel
  # (and tray tilt) can show up when you push the stick hard.
  cmd_vel_lpf: 0.28
  replan_ff_blend_s: 0.25

  collision_safety_margin:
    static_obstacles: 0.05

  cost_params:
    BaseVel:
      Qk: [1.0, 1.0, 8.0]
      P: [1.0, 1.0, 8.0]
    ControlEffort:
      Qvb: [0.20, 0.20, 2.0]
      Qub: [0.20, 0.20, 1.5]
      Qva: [0.20, 0.20, 0.20, 0.20, 0.20, 0.20]
      Qua: [0.04, 0.04, 0.04, 0.04, 0.04, 0.04]

  low_level_tracking:
    kp: [0, 0, 0, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

  upright:
    enabled: True
    eps_align: 1e-3

  teleop:
    enabled: true
    enable_button: 13
    ee_yaw_buttons: [14, 15]
    # Faster than joystick_teleop_with_obstacles (0.3) so tray tilt is observable.
    max_base_vel: [0.5, 0.5, 0.4]
    max_ee_vel: [0.12, 0.12, 0.12, 0.25, 0.25, 0.25]

  mpsf_params:
    objective_horizon: 10
    decay_rate: 0.85
    # Was 0.45: teleop BaseVel weights became too weak vs upright nullspace spin.
    mpsf_weight_multiplier: 1.0
    mpsf_base_mask: [true, true, true]
    mpsf_ee_mask: [true, true, true, true, true, true]

  self_collision_avoidance_enabled: True
  # SCENE SWITCH: False for empty, True for cluttered
  static_obstacles_collision_avoidance_enabled: False

  # SCENE SWITCH: bump / swap this name when changing empty vs cluttered (or upright).
  acados:
    name: "MPSF_BaseTeleop_Tray_Empty"
    # name: "MPSF_BaseTeleop_Tray_Clutter"
    cython:
      recompile: false
    ocp_solver_options:
      qp_solver_iter_max: 40

simulation:
  duration: 90

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    # SCENE SWITCH: empty vs cluttered
    path: "config/scene/empty.yaml"
    # path: "config/mpsf_experiments/scenes/tray_teleop_clutter_scene.yaml"

logging:
  log_dir: "mpsf_experiments/base_teleop_tray_balance"
  log_level: 20
