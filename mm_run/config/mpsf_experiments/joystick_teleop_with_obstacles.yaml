# MPSF Experiment: Joystick Teleop with Obstacles
#
# Hardware teleop overlay: global MPC.yaml has shared defaults (static soft-obs RBF v2).

controller:
  base_mask: [false, false, false]
  ee_mask: [false, false, false, false, false, false]

  base_velocity_guard:
    enabled: true

  base_velocity_idle_gate:
    enabled: true
    cmd_eps: 0.001
    meas_eps: 0.04
    arm_meas_eps: 0.05

  cmd_vel_lpf: 0.28                   # heavier output smoothing than MPC.yaml default
  replan_ff_blend_s: 0.15              # ~3 replans @ 20 Hz; 0.5 lags teleop, 0.05 jerky near obstacles

  collision_safety_margin:
    static_obstacles: 0.05            # target clearance; soft band extends by zeta

  cost_params:
    ControlEffort:
      Qva: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
      Qvb: [0.01, 0.01, 0.01]
      Qua: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
      Qub: [0.1, 0.1, 0.1]

  low_level_tracking:
    kp: [0, 0, 0, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

  teleop:
    enabled: true
    enable_button: 13  # d-pad up; same button as the hardware relay deadman
    ee_yaw_buttons: [12, 11]  # d-pad left, right
    max_base_vel: [0.3, 0.3, 0.3]  # [vx, vy, vyaw]
    max_ee_vel: [0.12, 0.12, 0.12, 0.25, 0.25, 0.25]

  mpsf_params:
    objective_horizon: 10   # Number of steps with non-zero weights (1 to N+1)
    decay_rate: 0.85         # Decay factor per time step (0 to 1)
    mpsf_weight_multiplier: 1.0
    mpsf_base_mask: [true, true, true]
    mpsf_ee_mask: [true, true, true, true, true, true]

  # Enable collision avoidance
  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: True

  # ACADOS solver option (bump name if you change constraint soft/hard structure)
  acados:
    name: "MPSF_Joystick_Teleop_Obs"

simulation:
  duration: 60

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    # path: "config/scene/empty.yaml"
    path: "config/mpsf_experiments/scenes/cluttered_scene.yaml"

logging:
  log_dir: "mpsf_experiments/joystick_teleop_with_obstacles"
  log_level: 20  # INFO level
