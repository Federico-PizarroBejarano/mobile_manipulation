# Teleop table-wipe. Same controls as teleop_pick_place.yaml; table-only scene.
#
# Mode is CLI only — same config for mpsf / direct / rl:
#   roslaunch mobile_manipulation_central thing.launch
#   roslaunch mm_run hardware_teleop.launch teleop:=mpsf|direct|rl \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/teleop_table_wipe.yaml
#
# Sim:
#   roslaunch mm_run teleop.launch
#   roslaunch mm_run run_pybullet_sim.launch teleop:=mpsf|direct|rl gui:=True \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/teleop_table_wipe.yaml
#
# Controls: mm_run/config/teleop/README.md
# RL: sticks command EE; base from SAC. Override checkpoint via rl.checkpoint or
#   ... teleop:=rl _controller_rl_teleop/checkpoint:=/path/to/final_model.pth

controller:
  base_mask: [false, false, false]
  ee_mask: [false, false, false, false, false, false]

  base_velocity_guard:
    enabled: true

  base_velocity_idle_gate:
    enabled: true
    cmd_eps: 0.001
    meas_eps: 0.04
    arm_meas_eps: 0.05

  cmd_vel_lpf: 0.28
  replan_ff_blend_s: 0.15

  collision_safety_margin:
    static_obstacles: 0.04

  collision_constraints_softened:
    self: False
    static_obstacles: False

  cost_params:
    ControlEffort:
      Qva: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02]
      Qvb: [0.2, 0.05, 0.2]
      Qua: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02]
      Qub: [0.2, 0.05, 0.2]
    EEVel:
      Qk: [1.0, 1.0, 1.0, 0.5, 0.5, 0.5]
      P:  [1.0, 1.0, 1.0, 0.5, 0.5, 0.5]

  low_level_tracking:
    kp: [0, 0, 0, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

  upright:
    enabled: false

  teleop:
    enabled: true
    max_base_vel: [0.3, 0.3, 0.3]  # [vx, vy, vyaw]
    max_ee_vel: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    # Stick-frame slew [m/s^2, m/s^2, rad/s^2] and EE [m/s^2 x3, rad/s^2 x3].
    reference_ramp:
      base: [0.35, 0.35, 0.2]
      ee: [0.75, 0.75, 0.75, 1.0, 1.0, 1.0]
    # 1.0 keeps YAML effort weights. EE mode scales Qvb/Qub; base mode scales Qva/Qua.
    ee_teleop_strictness: 10.0
    base_teleop_strictness: 1.0

  mpsf_params:
    objective_horizon: 10
    decay_rate: 0.95
    mpsf_weight_multiplier: 15.0
    mpsf_base_mask: [true, true, true]
    mpsf_ee_mask: [true, true, true, true, true, true]

  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: True

  acados:
    name: "MPSF_Teleop_TableWipe"

# Differential IK for direct / rl EE mode (ignored by mpsf).
ik:
  use_weighted_regularization: true
  regularization_strength: 0.01

rl:
  checkpoint: "checkpoints/final_model.pth"

simulation:
  duration: 60
  robot:
    home: [-0.33665274, -0.90893908, -0.00288675, 1.57075858, -1.18163425, 1.48354578, 1.18163860, 1.57084656, 1.57066226]

include:
  - package: "mm_rl"
    path: "config/rl_config.yaml"
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/mpsf_experiments/scenes/table_wipe_scene.yaml"

logging:
  log_dir: "mpsf_experiments/teleop_table_wipe"
  log_level: 20
  # debug keeps the MPC horizon dump. deploy skips it and runs the control loop faster.
  profile: deploy
  prompt_trial_metadata: True
  # Independent wipe polylines (world frame). Table-to-table transitions are not scored.
  path_coverage:
    # Waypoints are compared to the logged EE frame origin (not the pad tip);
    # measure in that frame or widen epsilon for tool offsets.
    epsilon: 0.10
    sample_spacing: 0.01
    paths:
      - name: table1
        waypoints:
          - [0.90, -0.29, 0.78]
          - [1.33, -0.52, 0.78]
          - [1.05, -0.92, 0.78]
          - [0.85, -1.43, 0.78]
          - [1.41, -1.46, 0.78]
      - name: table2
        waypoints:
          - [1.25, -1.77, 0.95]
          - [0.90, -2.06, 0.95]
          - [1.39, -2.34, 0.95]
          - [0.93, -2.60, 0.95]
