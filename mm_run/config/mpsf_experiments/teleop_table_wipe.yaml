# Teleop table-wipe. Same controls as teleop_pick_place.yaml; table-only scene.
#
# Mode is CLI only — same config for mpsf / direct / rl:
#   roslaunch mobile_manipulation_central thing.launch
#   roslaunch mm_run hardware_teleop.launch teleop:=mpsf|direct|rl \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/teleop_table_wipe.yaml
#
# Sim:
#   roslaunch mm_run teleop.launch
#   roslaunch mm_run run_pybullet_sim.launch teleop:=mpsf|direct|rl gui:=True \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/teleop_table_wipe.yaml
#
# Hold d-pad up to enable. Square or Enter to start/stop. Triangle toggles gripper.
# RL: sticks command EE; base from SAC. Override checkpoint via rl.checkpoint or
#   ... teleop:=rl _controller_rl_teleop/checkpoint:=/path/to/final_model.pth

controller:
  base_mask: [false, false, false]
  ee_mask: [false, false, false, false, false, false]

  base_velocity_guard:
    enabled: true

  base_velocity_idle_gate:
    enabled: true
    cmd_eps: 0.001
    meas_eps: 0.04
    arm_meas_eps: 0.05

  cmd_vel_lpf: 0.28
  replan_ff_blend_s: 0.15

  collision_safety_margin:
    static_obstacles: 0.04

  cost_params:
    ControlEffort:
      Qva: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
      Qvb: [0.015, 0.015, 0.015]
      Qua: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
      Qub: [0.05, 0.05, 0.05]

  low_level_tracking:
    kp: [0, 0, 0, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

  upright:
    enabled: false

  teleop:
    enabled: true
    enable_button: 13  # d-pad up; same button as the hardware relay deadman
    ee_yaw_buttons: [12, 11]  # d-pad left, right
    max_base_vel: [0.3, 0.3, 0.3]  # [vx, vy, vyaw]
    max_ee_vel: [0.12, 0.12, 0.12, 0.25, 0.25, 0.25]

  mpsf_params:
    objective_horizon: 10
    decay_rate: 0.85
    mpsf_weight_multiplier: 1.0
    mpsf_base_mask: [true, true, true]
    mpsf_ee_mask: [true, true, true, true, true, true]

  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: True

  acados:
    name: "MPSF_Teleop_TableWipe"

# Differential IK for direct / rl EE mode (ignored by mpsf).
ik:
  use_weighted_regularization: true
  regularization_strength: 0.1

rl:
  checkpoint: "checkpoints/final_model.pth"

simulation:
  duration: 60
  robot:
    home: [-0.33665274, -0.90893908, -0.00288675, 1.57075858, -1.18163425, 1.48354578, 1.18163860, 1.57084656, 1.57066226]

include:
  - package: "mm_rl"
    path: "config/rl_config.yaml"
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/mpsf_experiments/scenes/table_wipe_scene.yaml"

logging:
  log_dir: "mpsf_experiments/teleop_table_wipe"
  log_level: 20
