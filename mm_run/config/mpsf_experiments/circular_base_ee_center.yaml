# MPSF Experiment 3: Circular Base Path with EE at Center
# The base follows a circular trajectory via MPC path planning, while the EE's
# MPSF goal is to stay at the center of the circle (position only, orientation
# doesn't matter). This tests MPSF's ability to maintain EE position while base moves.

planner:
  tasks:
  # Task: Circular base path
  # Generate waypoints for a circle centered at (1.5, 0.4) with radius 0.8
  - name: Circular Base Path
    planner_type: PathPlanner
    base_path:
      - [0.0,    0.0,   0.0]
      - [0.2,    0.75,  -0.167pi]
      - [0.75,   1.3,   -0.333pi]
      - [1.5,    1.5,   -0.5pi]
      - [2.25,   1.3,   -0.667pi]
      - [2.8,    0.75,  -0.833pi]
      - [3.0,    0.0,   -1pi]
      - [2.8,   -0.75,  -1.167pi]
      - [2.25,  -1.3,   -1.333pi]
      - [1.5,   -1.5,   -1.5pi]
      - [0.75,  -1.3,   -1.667pi]
      - [0.2,   -0.75,  -1.833pi]
      - [0.0,    0.0,   -2pi]
    dt: 1  # Time step between waypoints
    end_stop: false  # Don't require zero velocity at end

controller:
  base_mask: [true, true, true]
  ee_mask: [false, false, false, false, false, false]

  # MPSF parameters - EE must stay at center while base moves in circle
  mpsf_params:
    objective_horizon: 10   # Number of steps with non-zero weights (1 to N+1)
    decay_rate: 1.0         # Decay factor per time step (0 to 1)
    mpsf_base_mask: [false, false, false]  # Base follows path planner
    mpsf_ee_mask: [true, true, true, false, false, false]  # MPSF controls EE position only
    mpsf_weight_multiplier: 1.0
    mpsf_ee_goal: [1.5, 0.4, 0.7, 0, 0, 0]  # [x, y, z, roll, pitch, yaw] - Center of circle

  # Enable collision avoidance
  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: False  # No obstacles in this experiment

  # ACADOS solver option
  acados:
    name: "MPSF_Circular_Base_EE_Center"

simulation:
  duration: 13  # Longer duration to complete circle

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/scene/empty.yaml"

logging:
  log_dir: "mpsf_experiments/circular_base_ee_center"
  log_level: 20  # INFO level
