# RL teleop: joystick EE (MoMa integrate) + SAC base → MpcPlan → low_level.
#
# Hardware:
#   roslaunch mobile_manipulation_central thing.launch
#   roslaunch mm_run hardware_teleop.launch teleop:=rl \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/rl_teleop.yaml
#
# Sim:
#   roslaunch mm_run teleop.launch
#   roslaunch mm_run run_pybullet_sim.launch teleop:=rl gui:=True \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/rl_teleop.yaml
#
# Hold d-pad up to enable. Square or Enter to start/stop. Triangle toggles gripper.
# Sticks command EE only; base comes from the RL policy.
#
# Override checkpoint:
#   ... teleop:=rl _controller_rl_teleop/checkpoint:=/path/to/final_model.pth
# or set rl.checkpoint below / pass --checkpoint on the node.

include:
  - package: "mm_rl"
    path: "config/rl_config.yaml"
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/scene/empty.yaml"

rl:
  # Package-relative path resolved from cwd or absolute path
  checkpoint: "checkpoints/final_model.pth"

controller:
  teleop:
    enabled: true
    enable_button: null
    ee_yaw_buttons: [12, 11]  # d-pad left, right
    max_base_vel: [0.3, 0.3, 0.3]
    max_ee_vel: [0.12, 0.12, 0.12, 0.25, 0.25, 0.25]

  cmd_vel_lpf: 0.28
  replan_ff_blend_s: 0.15

  self_collision_avoidance_enabled: False
  static_obstacles_collision_avoidance_enabled: False

ik:
  use_weighted_regularization: true
  regularization_strength: 0.1

simulation:
  duration: 60

logging:
  log_dir: "mpsf_experiments/rl_teleop"
  log_level: 20
