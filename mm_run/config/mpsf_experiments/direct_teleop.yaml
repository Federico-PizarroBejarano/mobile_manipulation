# Direct teleop (no MPC/MPSF): sticks → synthetic MpcPlan → low_level_cmd_node.
#
# Hardware:
#   roslaunch mobile_manipulation_central thing.launch
#   roslaunch mm_run hardware_teleop.launch teleop:=direct \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/direct_teleop.yaml
#
# Sim:
#   roslaunch mm_run teleop.launch
#   roslaunch mm_run run_pybullet_sim.launch teleop:=direct gui:=True \
#     config:=$(rospack find mm_run)/config/mpsf_experiments/direct_teleop.yaml
#
# Hold d-pad up, Square or Enter to start. Cross toggles base/EE
# (EE: arm-only differential IK). Triangle toggles gripper. Square again to stop.

controller:
  teleop:
    enabled: true
    enable_button: 13
    ee_yaw_buttons: [14, 15]
    max_base_vel: [0.3, 0.3, 0.3]
    max_ee_vel: [0.12, 0.12, 0.12, 0.25, 0.25, 0.25]

  # Match joystick MPSF feel for user-study comparisons.
  cmd_vel_lpf: 0.28
  replan_ff_blend_s: 0.15

  self_collision_avoidance_enabled: False
  static_obstacles_collision_avoidance_enabled: False

# Differential IK for EE mode (arm only; base held at zero).
ik:
  use_weighted_regularization: true
  regularization_strength: 0.1

simulation:
  duration: 60

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/scene/empty.yaml"

logging:
  log_dir: "mpsf_experiments/direct_teleop"
  log_level: 20
