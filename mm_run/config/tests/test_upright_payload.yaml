planner:
  tasks:
    - name: EEMoveWhileBalanced
      planner_type: WaypointPlanner
      ee_pose: [2.55, 0.4, 1.05, 0.0, 0.0, 0.0]
      tracking_pos_err_tol: 0.08

controller:
  dt: 0.1
  prediction_horizon: 1.0
  base_mask: [false, false, false]
  ee_mask: [true, true, true, false, false, false]
  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: True
  upright:
    enabled: True
    eps_align: 1e-4
  acados:
    name: "TestAlignedPayload"
    cython:
      recompile: false
    ocp_solver_options:
      qp_solver_iter_max: 40
  low_level_tracking:
    enabled: true
    kp: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
    log_refs: true   # sim only: log ll_v_ffs, ll_q_refs, ll_v_cmds when enabled

simulation:
  duration: 8
  timestep: 0.01
  robot:
    home: [0.06492914, -0.05419276, -0.04503236,  1.74097135, -0.31314123,
        0.99901806, -2.25675201,  1.5668383 ,  2.82451102]
    urdf:
      includes:
        - "$(find mobile_manipulation_central)/urdf/xacro/cartesian_base_joints.urdf.xacro"
        - "$(find mobile_manipulation_central)/urdf/xacro/thing_no_wheels.urdf.xacro"
        - "$(find mm_assets)/thing/xacro/end_effector_tray_gripped.urdf.xacro"
        - "$(find mm_assets)/thing/xacro/arm_coverage.urdf.xacro"
        - "$(find mm_assets)/thing/xacro/cameras.urdf.xacro"
  cargo_box:
    enabled: true
    mass: 0.5
    mu: 0.25
    tray_mu: 0.5
    side_lengths: [0.12, 0.12, 0.15]
    spawn_offset: [0.0, 0.0, 0.12]
    fell_rel_z_tool_threshold: -0.03
    color: [0.9, 0.2, 0.2, 1.0]
  physics:
    num_sub_steps: 4
    num_solver_iterations: 120

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/scene/empty.yaml"

logging:
  log_dir: "test_experiments/upright_payload"
  log_level: 10
