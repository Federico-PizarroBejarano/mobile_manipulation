# Integration Test: Orientation-Only Movement
# Hold EE position and change orientation only (z-position must stay in the mask /
# reference — otherwise free translation dips the arm into the ground).

planner:
  tasks:
  - name: EE Orientation Facing Down
    planner_type: WaypointPlanner
    ee_pose: [0, 0, 1, -1pi, 0, 0]  # World frame: [x, y, z, roll, pitch, yaw]
    tracking_ori_err_tol: 0.05
  - name: EE Orientation Facing Backwards
    planner_type: WaypointPlanner
    ee_pose: [0, 0, 1, -1pi, 0.5pi, 0]  # World frame: [x, y, z, roll, pitch, yaw]
    tracking_ori_err_tol: 0.05

controller:
  base_mask: [false, false, false]
  # Track z-position + orientation so the arm does not freely translate into the ground
  ee_mask: [false, false, true, true, true, true]

  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: False
  acados:
    name: "TestOrientationTracking"

simulation:
  duration: 8

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/scene/empty.yaml"

logging:
  log_dir: "test_experiments/orientation_tracking"
  log_level: 10
