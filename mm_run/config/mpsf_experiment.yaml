# Example configuration demonstrating MPC with velocity-only tracking (similar to MPSF)
# This showcases:
# - MPC controller tracking only base and EE velocities (no pose tracking)
# - Self-collision avoidance (important safety feature)
# - Velocity commands in state-space (base + EE velocities)

planner:
  tasks:
  - name: Position Only
    planner_type: WaypointPlanner
    base_pose: [1.5, 0.4, 0.5]   # x, y, yaw in world frame
    tracking_pos_err_tol: 0.08

controller:
  base_mask: [true, true, true]
  ee_mask: [false, false, false, false, false, false]

  # MPSF parameters
  mpsf_params:
    objective_horizon: 10   # Number of steps with non-zero weights (1 to N+1), default: N+1
    decay_rate: 1.0         # Decay factor per time step (0 to 1), default: 1.0 (no decay)
    mpsf_base_mask: [false, false, false]
    mpsf_ee_mask: [true, true, true, false, false, false]

  self_collision_avoidance_enabled: True
  static_obstacles_collision_avoidance_enabled: True

  # ACADOS solver option - only override the name (everything else inherited from MPC.yaml)
  acados:
    name: "MPSF_Velocity"

simulation:
  duration: 4

include:
  - package: "mm_run"
    path: "config/robot/thing.yaml"
  - package: "mm_run"
    path: "config/controller/MPC.yaml"  # Use MPC config for base controller settings
  - package: "mm_run"
    path: "config/sim/simulation.yaml"
  - package: "mm_run"
    path: "config/scene/empty.yaml"

logging:
  log_dir: "mpc_velocity_experiment"
  log_level: 10 # 0 - not set, 10 - debug, 20 - info
