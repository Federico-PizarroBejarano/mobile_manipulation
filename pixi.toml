numpy = ">=1.24.4,<2"
rospkg = ">=1.5.1,<2"
pip = ">=24.3.1,<25"
matplotlib = ">=3.7.3,<4"

[pypi-dependencies]
torch = ">=2.4.1, <3"
catkin-pkg = "*"
pyb-utils = ">=2.4.2, <3"
xacro = ">=2.1.1, <3"
