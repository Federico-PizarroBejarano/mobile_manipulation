[workspace]
channels = ["conda-forge"]
name = "mobile_manipulation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.8.*"
spatialmath-python = ">=1.1.13,<2"
pybullet = ">=3.25,<4"
casadi = ">=3.6.5,<4"
liecasadi = ">=0.0.6,<0.0.7"
